services:
  db:
    image: pgvector/pgvector:pg17
    container_name: localrag-db
    environment:
      POSTGRES_USER: localrag
      POSTGRES_PASSWORD: localrag
      POSTGRES_DB: localrag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - localrag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localrag -d localrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  localrag-data:
